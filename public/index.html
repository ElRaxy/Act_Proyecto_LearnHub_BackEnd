<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Gestión</title>

    <link rel="stylesheet" href="/styless_html.css" />

    <link rel="icon" type="image/svg+xml" href="/image/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="bg"></div>

    <div class="wrap">
      <h1>Panel de Gestión</h1>

      <div class="options">
        <a href="/courses/rss" class="item fadeUp" style="--d: 0s">
          <div class="iconFrame">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span>Cursos</span>
        </a>

        <a href="/users/rss" class="item fadeUp" style="--d: 0.12s">
          <div class="iconFrame"><i class="fa-solid fa-users"></i></div>
          <span>Usuarios</span>
        </a>

        <a href="/enrollments/rss" class="item fadeUp" style="--d: 0.24s">
          <div class="iconFrame">
            <i class="fa-solid fa-file-circle-check"></i>
          </div>
          <span>Matrículas</span>
        </a>
      </div>
    </div>
  </body>
</html>
